name: Test Python Compatibility

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: CI (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
        exclude:
          # Giảm số job: Ubuntu chỉ test 3.10 và 3.12, Windows test 3.10 và 3.12
          - os: ubuntu-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.11'
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/requirements.txt

      - name: Prepare log folder
        run: |
          mkdir -p ci-logs
          echo "CI started on $RUNNER_OS" > ci-logs/00-start.txt

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libglib2.0-0 libsm6 libxext6 libxrender-dev \
            libgl1-mesa-glx libglib2.0-0 \
            ffmpeg portaudio19-dev \
            || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel --timeout 60

          # Loại bỏ pyaudio (Windows-only) khi cài đặt
          python -c "
          from pathlib import Path
          lines = Path('requirements/requirements.txt').read_text(encoding='utf-8').splitlines()
          filtered = [line for line in lines if not line.lstrip().startswith('#') and 'pyaudio' not in line.lower()]
          Path('ci-logs/requirements-ci.txt').write_text('\n'.join(filtered) + '\n', encoding='utf-8')
          "

          python -m pip install --prefer-binary --timeout 60 -r ci-logs/requirements-ci.txt

          python -m pip install coverage --timeout 60

      - name: Compile Python sources
        run: |
          python -m compileall .

      - name: Lint with Ruff
        run: |
          ruff check . --ignore E402

      - name: Type check with mypy
        run: |
          mypy medical utils entrypoints --exclude app/chat_ui --ignore-missing-imports --follow-imports=skip --allow-untyped-defs --allow-incomplete-defs --allow-untyped-calls --no-warn-return-any

      - name: Smoke check
        run: |
          python -c "import pathlib; p = pathlib.Path('entrypoints/run_smoke.py'); print('Found' if p.exists() else 'Not found')"
          if (Test-Path "entrypoints/run_smoke.py") { python entrypoints/run_smoke.py --ci-safe --stop-on-fail } else { echo "Skipped: entrypoints/run_smoke.py not found" }
        shell: auto

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --cov=medical --cov=core --cov=utils --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html --ignore=tests/integration/

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v --ignore=tests/integration/test_clinical_validation.py

      - name: Enforce coverage threshold
        run: |
          python -m pytest tests/ --cov=medical --cov=core --cov=utils --cov-report=term --cov-fail-under=50 --durations=10

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ runner.os }}-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7
          if-no-files-found: warn

      - name: Create CI summary
        if: always()
        run: |
          mkdir -p ci-logs
          cat > ci-logs/00-ci-summary.md << 'EOF'
          # CI Summary

          Nếu có step màu đỏ, mở trực tiếp step đó trong tab Actions để xem log đầy đủ.
          Bản sao log cũng được upload thành artifact bên dưới.
          EOF
          cat ci-logs/00-ci-summary.md
          cat ci-logs/00-ci-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ runner.os }}-${{ matrix.python-version }}-${{ github.sha }}
          path: ci-logs
          retention-days: 7
          compression-level: 6
          if-no-files-found: warn
