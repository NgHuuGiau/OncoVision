name: Test Python Compatibility

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: CI (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
        exclude:
          # Giảm số job: Ubuntu chỉ test 3.10 và 3.12, Windows test 3.10 và 3.12
          - os: ubuntu-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.11'
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/requirements.txt

      - name: Prepare log folder
        run: |
          python -c "import pathlib; pathlib.Path('ci-logs').mkdir(exist_ok=True); pathlib.Path('ci-logs/00-start.txt').write_text('CI started\n')"

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libglib2.0-0 libsm6 libxext6 libxrender-dev \
            libgl1-mesa-glx libglib2.0-0 \
            ffmpeg portaudio19-dev \
            || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel --timeout 60

          # Loại bỏ pyaudio (Windows-only) khi cài đặt
          python -c "
          from pathlib import Path
          lines = Path('requirements/requirements.txt').read_text(encoding='utf-8').splitlines()
          filtered = [line for line in lines if not line.lstrip().startswith('#') and 'pyaudio' not in line.lower()]
          Path('ci-logs/requirements-ci.txt').write_text('\n'.join(filtered) + '\n', encoding='utf-8')
          "

          python -m pip install --prefer-binary --timeout 60 -r ci-logs/requirements-ci.txt

          # Install dev dependencies for testing
          python -c "
          import pathlib, subprocess, sys
          dev_req = pathlib.Path('requirements/requirements-dev.txt')
          if dev_req.exists():
              subprocess.run([sys.executable, '-m', 'pip', 'install', '--prefer-binary', '--timeout', '60', '-r', str(dev_req)], check=False)
          "

      - name: Compile Python sources
        run: |
          python -m compileall . || echo "Some files failed to compile (non-fatal)"

      - name: Lint with Ruff
        run: |
          ruff check . --ignore E402

      - name: Type check with mypy
        run: |
          mypy medical utils entrypoints --exclude app/chat_ui --ignore-missing-imports --follow-imports=skip --allow-untyped-defs --allow-incomplete-defs --allow-untyped-calls --no-warn-return-any

      - name: Smoke check
        run: |
          python -c "
          import pathlib, subprocess, sys
          p = pathlib.Path('entrypoints/run_smoke.py')
          if p.exists():
              result = subprocess.run([sys.executable, str(p), '--ci-safe', '--stop-on-fail'], check=False)
              sys.exit(result.returncode)
          else:
              print('Skipped: entrypoints/run_smoke.py not found')
          "

      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/ -v --cov=medical --cov=core --cov=utils --cov=app --cov-report=term-missing --cov-report=xml --ignore=tests/integration/ -q
        continue-on-error: true

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v --ignore=tests/integration/test_clinical_validation.py -q
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ runner.os }}-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7
          if-no-files-found: warn

      - name: Create CI summary
        if: always()
        run: |
          python -c "
          import pathlib
          pathlib.Path('ci-logs').mkdir(exist_ok=True)
          summary = '# CI Summary\n\nNếu có step màu đỏ, mở trực tiếp step đó trong tab Actions để xem log đầy đủ.\nBản sao log cũng được upload thành artifact bên dưới.\n'
          pathlib.Path('ci-logs/00-ci-summary.md').write_text(summary)
          print(summary)
          "

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ runner.os }}-${{ matrix.python-version }}-${{ github.sha }}
          path: ci-logs
          retention-days: 7
          compression-level: 6
          if-no-files-found: warn
