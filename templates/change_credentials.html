<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="stylesheet" href="/static/css/auth.css">
  <title>Đổi tài khoản/mật khẩu · OncoVision</title>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <h1>OncoVision</h1>
    <p class="auth-subtitle">Lần đầu đăng nhập: hãy đổi tài khoản và mật khẩu mới.</p>
    <p class="auth-notice">Tài khoản hiện tại: <strong>{{ current_username }}</strong> (mặc định admin/admin)</p>
    {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/change-credentials" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field"><label for="new_username">Tài khoản mới</label><input id="new_username" name="new_username" autocomplete="username" required autofocus></div>
      <div class="field"><label for="new_password">Mật khẩu mới (ít nhất 8 ký tự)</label>
        <div class="password-wrap">
          <input id="new_password" name="new_password" type="password" autocomplete="new-password" required minlength="8">
          <button type="button" class="password-toggle" onclick="const p=document.getElementById('new_password');const on=p.type==='password';p.type=on?'text':'password';this.textContent=on?'Ẩn':'Hiện';this.setAttribute('aria-pressed',on);" aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button>
        </div>
      </div>
      <div class="field"><label for="confirm_password">Nhập lại mật khẩu mới</label>
        <div class="password-wrap">
          <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required minlength="8">
          <button type="button" class="password-toggle" onclick="const p=document.getElementById('confirm_password');const on=p.type==='password';p.type=on?'text':'password';this.textContent=on?'Ẩn':'Hiện';this.setAttribute('aria-pressed',on);" aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button>
        </div>
      </div>
      <button class="auth-primary" type="submit">Lưu thay đổi</button>
    </form>
  </main>
</body>
</html>
