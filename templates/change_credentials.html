<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/auth.css">
  <title>Đổi thông tin đăng nhập · OncoVision</title>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <h1>OncoVision</h1>
    <p class="auth-subtitle">Lần đầu đăng nhập: hãy đổi tài khoản và mật khẩu mới.</p>
    <p class="auth-notice">Tài khoản hiện tại: <strong>{{ current_username }}</strong></p>
    {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/change-credentials" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field"><label for="new_username">Tài khoản mới</label><input id="new_username" name="new_username" autocomplete="username" required autofocus></div>
      <div class="field"><label for="new_password">Mật khẩu mới (≥ 8 ký tự)</label><input id="new_password" name="new_password" type="password" autocomplete="new-password" required minlength="8"></div>
      <div class="field"><label for="confirm_password">Nhập lại mật khẩu mới</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required minlength="8"></div>
      <button class="auth-primary" type="submit">Lưu thay đổi</button>
    </form>
  </main>
</body>
</html>
