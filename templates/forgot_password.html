<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Khôi phục mật khẩu · OncoVision</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#e5edf8;font:16px system-ui,sans-serif}
    main{width:min(440px,calc(100% - 32px));padding:32px;border:1px solid #26344a;border-radius:18px;background:#121c2d;box-shadow:0 24px 80px #0005}
    h1{margin:0 0 8px;font-size:25px}.muted{color:#9baec7;margin:0 0 24px}.field{display:grid;gap:7px;margin:16px 0}label{font-size:14px;color:#c5d3e5}input{width:100%;padding:12px;border:1px solid #34445d;border-radius:9px;background:#0b1220;color:#fff;font:inherit}input:focus{outline:2px solid #38bdf8;border-color:transparent}button{width:100%;padding:12px;border:0;border-radius:9px;background:#0284c7;color:white;font:600 15px system-ui;cursor:pointer}button:hover{background:#0369a1}.error{padding:10px 12px;border-radius:8px;background:#4c1d2a;color:#fecdd3;margin:0 0 14px}.foot{margin-top:20px;color:#8193aa;font-size:12px;line-height:1.5}.foot a{color:#7dd3fc}
  </style>
</head>
<body>
  <main>
    <h1>Khôi phục mật khẩu</h1>
    <p class="muted">Nhập tài khoản và mã khôi phục 6 ký tự do quản trị viên cấp. Mã chỉ dùng được một lần.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/forgot-password" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field"><label for="username">Tài khoản</label><input id="username" name="username" autocomplete="username" required autofocus></div>
      <div class="field"><label for="recovery_code">Mã khôi phục</label><input id="recovery_code" name="recovery_code" minlength="6" maxlength="6" pattern="[A-Za-z0-9]{6}" autocomplete="one-time-code" required></div>
      <div class="field"><label for="password">Mật khẩu mới (ít nhất 12 ký tự)</label><input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required></div>
      <div class="field"><label for="confirm_password">Nhập lại mật khẩu mới</label><input id="confirm_password" name="confirm_password" type="password" minlength="12" autocomplete="new-password" required></div>
      <button type="submit">Đặt lại mật khẩu</button>
    </form>
    <p class="foot"><a href="/login">Quay lại đăng nhập</a> · Chưa có mã? Liên hệ quản trị viên để cấp lại.</p>
  </main>
</body>
</html>
