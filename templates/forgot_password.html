<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <script>const savedTheme=localStorage.getItem('theme')||'system';document.documentElement.dataset.theme=savedTheme==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):savedTheme;</script>
  <link rel="stylesheet" href="/static/css/auth.css">
  <script defer src="/static/js/auth-theme.js"></script>
  <title>Khôi phục mật khẩu · OncoVision</title>
</head>
<body class="auth-page">
  <button class="theme-toggle" type="button" onclick="toggleAuthTheme()" aria-label="Chuyển đổi giao diện sáng/tối">◐ Giao diện</button>
  <main class="auth-shell">
    <h1>Khôi phục mật khẩu</h1>
    <p class="auth-subtitle">Nhập tài khoản và mã khôi phục 6 ký tự do quản trị viên cấp. Mã chỉ dùng được một lần.</p>
    {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/forgot-password" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field"><label for="username">Tài khoản</label><input id="username" name="username" autocomplete="username" required autofocus></div>
      <div class="field"><label for="recovery_code">Mã khôi phục</label><input id="recovery_code" name="recovery_code" minlength="6" maxlength="6" pattern="[A-Za-z0-9]{6}" autocomplete="one-time-code" required></div>
      <div class="field"><label for="password">Mật khẩu mới (ít nhất 12 ký tự)</label><input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required></div>
      <div class="field"><label for="confirm_password">Nhập lại mật khẩu mới</label><input id="confirm_password" name="confirm_password" type="password" minlength="12" autocomplete="new-password" required></div>
      <button class="auth-primary" type="submit">Đặt lại mật khẩu</button>
    </form>
    <p class="auth-foot"><a href="/login">Quay lại đăng nhập</a> · Chưa có mã? Liên hệ quản trị viên để cấp lại.</p>
  </main>
</body>
</html>
