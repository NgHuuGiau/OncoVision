<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Đăng nhập · OncoVision</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#e5edf8;font:16px system-ui,sans-serif}
    main{width:min(420px,calc(100% - 32px));padding:32px;border:1px solid #26344a;border-radius:18px;background:#121c2d;box-shadow:0 24px 80px #0005}
    h1{margin:0 0 8px;font-size:25px}.muted{color:#9baec7;margin:0 0 24px}.field{display:grid;gap:7px;margin:16px 0}label{font-size:14px;color:#c5d3e5}input{width:100%;padding:12px;border:1px solid #34445d;border-radius:9px;background:#0b1220;color:#fff;font:inherit}input:focus{outline:2px solid #38bdf8;border-color:transparent}button{width:100%;padding:12px;border:0;border-radius:9px;background:#0284c7;color:white;font:600 15px system-ui;cursor:pointer}button:hover{background:#0369a1}.error{padding:10px 12px;border-radius:8px;background:#4c1d2a;color:#fecdd3;margin:0 0 14px}.foot{margin-top:20px;color:#8193aa;font-size:12px;line-height:1.5}
  </style>
</head>
<body>
  <main>
    <h1>OncoVision</h1>
    <p class="muted">Đăng nhập để truy cập hồ sơ phân tích.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field"><label for="username">Tài khoản</label><input id="username" name="username" autocomplete="username" required autofocus></div>
      <div class="field"><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button type="submit">Đăng nhập</button>
    </form>
    <p class="foot">Chỉ quản trị viên được cấp tài khoản. Nếu chưa có tài khoản, hãy liên hệ quản trị viên hệ thống.</p>
  </main>
</body>
</html>
