<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="stylesheet" href="/static/css/auth.css">
  <title>Đăng nhập · OncoVision</title>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <h1>OncoVision</h1>
    <p class="auth-subtitle">Đăng nhập để truy cập hồ sơ phân tích.</p>
    {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
    {% if reset %}<p class="auth-notice" role="status">Đổi mật khẩu thành công. Hãy đăng nhập bằng mật khẩu mới.</p>{% endif %}
    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field"><label for="username">Tài khoản</label><input id="username" name="username" autocomplete="username" required autofocus></div>
      <div class="field"><label for="password">Mật khẩu</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" onclick="const p=document.getElementById('password');const on=p.type==='password';p.type=on?'text':'password';this.textContent=on?'Ẩn':'Hiện';this.setAttribute('aria-pressed',on);" aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button>
        </div>
      </div>
      <button class="auth-primary" type="submit">Đăng nhập</button>
    </form>
    <p class="auth-foot"><a href="/forgot-password">Quên mật khẩu?</a></p>
    <p class="auth-foot">Chỉ quản trị viên được cấp tài khoản. Nếu chưa có tài khoản, hãy liên hệ quản trị viên hệ thống.</p>
  </main>
</body>
</html>
